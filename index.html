<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ፊደል እንማር — Fidel Temari</title>
<meta name="description" content="Learn Amharic Fidel, numbers, vocabulary, and Ethiopian Orthodox Tewahedo faith basics — for kids, youth, and new learners." />

<!-- PWA -->
<link rel="manifest" href="./manifest.json" />
<meta name="theme-color" content="#0f6e5c" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fidel Temari" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />

<!-- Fonts: nice typography online, safe system fallback offline (see --font-body / --font-ethiopic in style.css) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@500;700;800&family=Noto+Sans+Ethiopic:wght@500;700&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="./css/style.css" />
</head>
<body>

<header class="topBar">
  <div class="brand">
    <span class="brandMark" lang="am" aria-hidden="true">ሀ</span>
    <span>ፊደል እንማር</span>
  </div>
  <button class="accountBtn" id="accountBtn" type="button">👤 Sign in</button>
</header>

<main>
  <section class="screen" id="screen-home"></section>
  <section class="screen" id="screen-fidel"></section>
  <section class="screen" id="screen-lab"></section>
  <section class="screen" id="screen-pictures"></section>
  <section class="screen" id="screen-faith"></section>
  <section class="screen" id="screen-progress"></section>
  <section class="screen" id="screen-signin"></section>
</main>

<nav class="bottomNav" aria-label="Main navigation">
  <button data-route="home" type="button"><span class="icon">🏠</span>Home</button>
  <button data-route="fidel" type="button"><span class="icon" lang="am">ሀ</span>Fidel</button>
  <button data-route="lab" type="button"><span class="icon">📝</span>Lab</button>
  <button data-route="pictures" type="button"><span class="icon">🐶</span>Pictures</button>
  <button data-route="faith" type="button"><span class="icon">📖</span>Faith</button>
</nav>

<script src="./js/app.bundle.js"></script>
</body>
</html>
